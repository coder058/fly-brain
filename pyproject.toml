[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flylab"
version = "0.2.0"
description = "Auditable experiments that use the Drosophila MaleCNS connectome as a recurrent network"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jordi Lluis" }]
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["flylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
